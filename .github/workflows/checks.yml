name: Foundation checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm --filter @ficka/web exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: ficka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ficka_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-only-ephemeral@localhost:5432/ficka_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/integration
        env:
          RUN_DB_TESTS: "1"
      - run: uv run alembic downgrade base
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f compose.yaml up --build --wait --wait-timeout 300
      - run: curl --fail http://localhost:3000/api/health/ready
      - run: curl --fail http://localhost:3000/
      - name: Stop source build stack, preserve disposable test volume
        run: docker compose -f compose.yaml down
      - name: Start image-only stack using the checked local images
        run: docker compose -f docker-compose.yml up --pull never --wait --wait-timeout 180
        env:
          FICKA_WEB_IMAGE: ficka-web:latest
          FICKA_API_IMAGE: ficka-api:latest
          WEB_BIND_ADDRESS: 127.0.0.1
      - run: curl --fail http://localhost:3000/api/health/ready
      - if: always()
        run: docker compose -f docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml down --volumes

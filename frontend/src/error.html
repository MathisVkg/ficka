<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% · Ficka</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f7f6f2;
        color: #1d1e20;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e6e3dc;
        border-radius: 16px;
        padding: 32px;
      }
      .wordmark {
        margin: 0 0 24px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #5f5e58;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        color: #1f5c5a;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">Ficka</p>
      <h1>Error %sveltekit.status%</h1>
      <p>%sveltekit.error.message%</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>

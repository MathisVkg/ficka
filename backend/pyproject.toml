[project]
name = "ficka-backend"
version = "0.1.0"
description = "Ficka API: self-hosted financial visualization for small businesses"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI / Typer use function calls in default arguments by design.
"app/cli.py" = ["B008"]
"app/api/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
